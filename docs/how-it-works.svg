<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" width="960" height="616" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- panel -->
  <rect x="2" y="2" width="956" height="612" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- header -->
  <text x="40" y="46" fill="#e2e8f0" font-size="26" font-weight="700">How HardTalkAI works</text>
  <text x="40" y="72" fill="#94a3b8" font-size="14">A FastAPI backend powers the coaching AI; mobile clients share Kotlin (KMP) logic.</text>

  <!-- ================= Architecture ================= -->
  <!-- Hero: FastAPI backend -->
  <rect x="280" y="92" width="400" height="78" rx="12" fill="#273449" stroke="#6366f1" stroke-width="2" />
  <text x="480" y="120" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">FastAPI backend - :3001</text>
  <text x="480" y="141" text-anchor="middle" fill="#94a3b8" font-size="12">scenarios / message scoring / coaching tips</text>
  <text x="480" y="159" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">+ optional AI counterpart reply (LLM)</text>

  <!-- /api arrows from clients up to backend -->
  <line x1="200" y1="222" x2="340" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="480" y1="222" x2="480" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="760" y1="222" x2="620" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="480" y="203" text-anchor="middle" fill="#94a3b8" font-size="11">/api (HTTP + JSON)</text>

  <!-- Clients row -->
  <!-- Web (live) -->
  <rect x="90" y="222" width="220" height="76" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="200" y="252" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Web app</text>
  <text x="200" y="272" text-anchor="middle" fill="#94a3b8" font-size="12">React + Vite</text>
  <text x="200" y="290" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="600">:5173</text>

  <!-- Android -->
  <rect x="370" y="222" width="220" height="76" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <text x="480" y="252" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Android</text>
  <text x="480" y="272" text-anchor="middle" fill="#94a3b8" font-size="12">Compose Multiplatform</text>
  <text x="480" y="290" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="600">emulator → :3001</text>

  <!-- iOS (planned) -->
  <rect x="650" y="222" width="220" height="76" rx="12" fill="#1e293b" stroke="#475569" stroke-dasharray="5 4" />
  <text x="760" y="252" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="700">iOS</text>
  <text x="760" y="272" text-anchor="middle" fill="#94a3b8" font-size="12">SwiftUI / Compose</text>
  <text x="760" y="290" text-anchor="middle" fill="#64748b" font-size="11">(planned)</text>

  <!-- shared KMP caption -->
  <text x="480" y="322" text-anchor="middle" fill="#94a3b8" font-size="12">:shared (Kotlin Multiplatform) gives Android/iOS shared UI, models, and a Ktor HTTP client — no second engine.</text>

  <!-- divider -->
  <line x1="40" y1="342" x2="920" y2="342" stroke="#334155" />

  <!-- ================= Practice loop ================= -->
  <text x="40" y="372" fill="#e2e8f0" font-size="18" font-weight="700">The practice loop</text>

  <!-- Card 1 -->
  <rect x="40" y="390" width="175" height="188" rx="12" fill="#1e293b" stroke="#334155" />
  <circle cx="70" cy="426" r="16" fill="#6366f1" />
  <text x="70" y="431" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">1</text>
  <text x="52" y="466" fill="#e2e8f0" font-size="14" font-weight="700">Pick a scenario</text>
  <text x="52" y="492" fill="#94a3b8" font-size="12">Ask for a raise, give</text>
  <text x="52" y="510" fill="#94a3b8" font-size="12">critical feedback, or</text>
  <text x="52" y="528" fill="#94a3b8" font-size="12">say no to extra work.</text>

  <!-- Card 2 -->
  <rect x="275" y="390" width="175" height="188" rx="12" fill="#1e293b" stroke="#334155" />
  <circle cx="305" cy="426" r="16" fill="#6366f1" />
  <text x="305" y="431" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">2</text>
  <text x="287" y="466" fill="#e2e8f0" font-size="14" font-weight="700">Talk to the AI</text>
  <text x="287" y="492" fill="#94a3b8" font-size="12">It role-plays the</text>
  <text x="287" y="510" fill="#94a3b8" font-size="12">counterpart and reacts</text>
  <text x="287" y="528" fill="#94a3b8" font-size="12">to your tone.</text>

  <!-- Card 3 -->
  <rect x="510" y="390" width="175" height="188" rx="12" fill="#1e293b" stroke="#334155" />
  <circle cx="540" cy="426" r="16" fill="#6366f1" />
  <text x="540" y="431" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">3</text>
  <text x="522" y="466" fill="#e2e8f0" font-size="14" font-weight="700">Get live coaching</text>
  <text x="522" y="494" fill="#94a3b8" font-size="10">Clarity</text>
  <rect x="582" y="486" width="95" height="8" rx="4" fill="#0f172a" />
  <rect x="582" y="486" width="76" height="8" rx="4" fill="#22c55e" />
  <text x="522" y="518" fill="#94a3b8" font-size="10">Empathy</text>
  <rect x="582" y="510" width="95" height="8" rx="4" fill="#0f172a" />
  <rect x="582" y="510" width="66" height="8" rx="4" fill="#84cc16" />
  <text x="522" y="542" fill="#94a3b8" font-size="10">Assert.</text>
  <rect x="582" y="534" width="95" height="8" rx="4" fill="#0f172a" />
  <rect x="582" y="534" width="52" height="8" rx="4" fill="#f59e0b" />
  <text x="522" y="566" fill="#94a3b8" font-size="11">+ specific tips.</text>

  <!-- Card 4 -->
  <rect x="745" y="390" width="175" height="188" rx="12" fill="#1e293b" stroke="#334155" />
  <circle cx="775" cy="426" r="16" fill="#6366f1" />
  <text x="775" y="431" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">4</text>
  <text x="757" y="466" fill="#e2e8f0" font-size="14" font-weight="700">Refine &amp; retry</text>
  <text x="757" y="492" fill="#94a3b8" font-size="12">Adjust your wording</text>
  <text x="757" y="510" fill="#94a3b8" font-size="12">and watch the</text>
  <text x="757" y="528" fill="#94a3b8" font-size="12">counterpart warm up.</text>

  <!-- loop arrows between cards -->
  <line x1="217" y1="484" x2="273" y2="484" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="452" y1="484" x2="508" y2="484" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="687" y1="484" x2="743" y2="484" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- footer -->
  <text x="40" y="602" fill="#64748b" font-size="12">Runs fully offline by default. Set OPENAI_API_KEY to enable AI-generated replies.</text>
</svg>
